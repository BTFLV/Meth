name: Meth
options:
  bundleIdPrefix: com.meth
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  MethCore:
    type: library.static
    platform: macOS
    sources:
      - Sources/MethCore
    frameworks:
      - framework: IOKit.framework
    settings:
      base:
        PRODUCT_NAME: MethCore
        PRODUCT_BUNDLE_IDENTIFIER: com.meth.core
        CODE_SIGNING_ALLOWED: NO
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  Meth:
    type: application
    platform: macOS
    sources:
      # Info.plist is consumed via INFOPLIST_FILE below; listing it here as well would
      # additionally copy it into Contents/Resources. AppIcon.icns is picked up from this
      # directory automatically and copied into the bundle's Resources.
      - path: Sources/Meth
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - target: MethCore
    info:
      path: Sources/Meth/Resources/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: MIT Licensed. See LICENSE.
        # Resources/AppIcon.icns, generated by scripts/generate_logo_assets.sh.
        CFBundleIconFile: AppIcon
    settings:
      base:
        PRODUCT_NAME: Meth
        PRODUCT_BUNDLE_IDENTIFIER: com.meth.app
        INFOPLIST_FILE: Sources/Meth/Resources/Info.plist
        CODE_SIGNING_ALLOWED: NO

  MethWatchdog:
    type: tool
    platform: macOS
    sources:
      - Sources/MethWatchdog
    dependencies:
      - target: MethCore
    settings:
      base:
        PRODUCT_NAME: MethWatchdog
        PRODUCT_BUNDLE_IDENTIFIER: com.meth.watchdog
        CODE_SIGNING_ALLOWED: NO

  MethTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/MethTests
    dependencies:
      - target: MethCore
    settings:
      base:
        PRODUCT_NAME: MethTests
        PRODUCT_BUNDLE_IDENTIFIER: com.meth.tests
        CODE_SIGNING_ALLOWED: NO

