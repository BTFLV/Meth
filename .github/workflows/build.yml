name: Build and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Outdated builds for the same ref can be cancelled freely (nothing user-facing depends on
# them); the `release` job below overrides this with its own non-cancelable group so a
# rolling-release publication can never be interrupted mid-way.
concurrency:
  group: meth-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Canonical correctness gate: builds the real Xcode project/scheme and runs the actual
  # XCTest suite. A lightweight SwiftPM build is kept alongside it because Package.swift is
  # a separately documented, supported build route that can drift from the Xcode project.
  verify:
    name: Verify
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Swift Package build (sanity check)
        run: swift build

      - name: Build Meth (Xcode, Release)
        run: |
          xcodebuild build \
            -project Meth.xcodeproj \
            -scheme Meth \
            -configuration Release \
            -derivedDataPath .derivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Run MethTests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Meth.xcodeproj \
            -scheme MethTests \
            -destination "platform=macOS" \
            -derivedDataPath .derivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-output.log

      - name: Confirm tests actually executed
        run: |
          set -euo pipefail
          summary_line="$(grep -E "Executed [0-9]+ tests?," test-output.log | tail -1 || true)"
          if [ -z "${summary_line}" ]; then
            echo "Could not find an 'Executed N tests' summary line in xcodebuild output; treating as a failure." >&2
            exit 1
          fi
          count="$(echo "${summary_line}" | grep -oE "Executed [0-9]+" | grep -oE "[0-9]+")"
          echo "xcodebuild reported: ${summary_line}"
          if [ "${count}" -lt 1 ]; then
            echo "xcodebuild test executed zero tests." >&2
            exit 1
          fi

  # Produces the actual downloadable artifact: a Universal 2 (arm64 + x86_64) Meth.app,
  # zipped, with its own internal validation (see scripts/build_app.sh). This is the only
  # place the release artifact is built; Release never rebuilds anything.
  package:
    name: Package
    needs: verify
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and package Meth.app
        run: ./scripts/build_app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Meth-dist
          path: dist/Meth.zip
          retention-days: 14

  # Publishes/updates the single persistent "rolling" release from the exact commit that
  # was just verified and packaged. Only runs for pushes to main or a manual dispatch on
  # main; never for pull requests. Needs no macOS-specific tooling.
  release:
    name: Update Rolling Release
    needs: package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: meth-rolling-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: Meth-dist
          path: dist

      - name: Validate the packaged artifact
        run: |
          set -euo pipefail
          test -s dist/Meth.zip
          unzip -tq dist/Meth.zip

      - name: Refuse to move the rolling release backwards
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          target_sha="${GITHUB_SHA}"

          if git rev-parse -q --verify refs/tags/rolling >/dev/null 2>&1; then
            current_sha="$(git rev-parse refs/tags/rolling)"
            if [ "${current_sha}" = "${target_sha}" ]; then
              echo "rolling already points at ${target_sha}; re-publishing in place."
            elif git merge-base --is-ancestor "${current_sha}" "${target_sha}"; then
              echo "Advancing rolling from ${current_sha} to ${target_sha}."
            else
              echo "Refusing to update rolling: current target ${current_sha} is not an ancestor of ${target_sha}." >&2
              exit 1
            fi
          else
            echo "No existing rolling tag; this will be the first release."
          fi

      - name: Prepare release notes
        run: |
          {
            echo "# Latest Meth Development Build"
            echo
            echo "This is the latest rolling development build of **Meth**, built directly from \`main\`."
            echo
            echo "- **Commit:** [\`${GITHUB_SHA::7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA})"
            echo "- **Workflow run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- **Build date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "### Download"
            echo
            echo "- \`Meth.zip\` — Universal (Apple Silicon + Intel) macOS application bundle"
            echo
            echo "> [!NOTE]"
            echo "> This is a continuously updated development build. It is ad-hoc signed and is not notarized."
          } > release_notes.md

      - name: Publish or update the rolling release
        run: |
          set -euo pipefail
          target_sha="${GITHUB_SHA}"

          if gh release view rolling --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "rolling release already exists; updating it in place."
          else
            echo "Creating rolling release for the first time (as a draft until the asset is uploaded)."
            gh release create rolling \
              --repo "${{ github.repository }}" \
              --draft \
              --target "${target_sha}" \
              --title "Latest Development Build" \
              --notes-file release_notes.md
          fi

          # Replace the asset in place; the release stays available throughout.
          gh release upload rolling dist/Meth.zip --repo "${{ github.repository }}" --clobber

          # Move the tag only after the new asset is confirmed uploaded above.
          git tag -f rolling "${target_sha}"
          git push origin refs/tags/rolling --force

          gh release edit rolling \
            --repo "${{ github.repository }}" \
            --draft=false \
            --prerelease=false \
            --latest \
            --title "Latest Development Build" \
            --notes-file release_notes.md

      - name: Verify final release state
        run: |
          set -euo pipefail
          target_sha="${GITHUB_SHA}"
          actual_tag_sha="$(git rev-parse refs/tags/rolling)"
          if [ "${actual_tag_sha}" != "${target_sha}" ]; then
            echo "rolling tag points at ${actual_tag_sha}, expected ${target_sha}." >&2
            exit 1
          fi

          view_json="$(gh release view rolling --repo "${{ github.repository }}" --json tagName,isDraft,isPrerelease,assets)"
          tag_name="$(echo "${view_json}" | jq -r '.tagName')"
          is_draft="$(echo "${view_json}" | jq -r '.isDraft')"
          is_prerelease="$(echo "${view_json}" | jq -r '.isPrerelease')"
          has_asset="$(echo "${view_json}" | jq -r '([.assets[].name] | index("Meth.zip")) != null')"

          if [ "${tag_name}" != "rolling" ] || [ "${is_draft}" != "false" ] || [ "${is_prerelease}" != "false" ] || [ "${has_asset}" != "true" ]; then
            echo "Release verification failed: tag=${tag_name} draft=${is_draft} prerelease=${is_prerelease} has_Meth.zip=${has_asset}" >&2
            exit 1
          fi
          echo "Verified: tag=rolling, draft=false, prerelease=false, Meth.zip present, commit=${target_sha}"
