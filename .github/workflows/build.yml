name: Build and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Outdated builds for the same ref can be cancelled freely (nothing user-facing depends on
# them); the `release` job below overrides this with its own non-cancelable group so a
# rolling-release publication can never be interrupted mid-way.
concurrency:
  group: meth-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Canonical correctness gate: builds the real Xcode project/scheme and runs the actual
  # XCTest suite. A lightweight SwiftPM build is kept alongside it because Package.swift is
  # a separately documented, supported build route that can drift from the Xcode project.
  verify:
    name: Verify
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Swift Package build (sanity check)
        run: swift build

      - name: Build Meth (Xcode, Release)
        run: |
          xcodebuild build \
            -project Meth.xcodeproj \
            -scheme Meth \
            -configuration Release \
            -derivedDataPath .derivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Run MethTests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Meth.xcodeproj \
            -scheme MethTests \
            -destination "platform=macOS" \
            -derivedDataPath .derivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-output.log

      - name: Confirm tests actually executed
        run: |
          set -euo pipefail
          summary_line="$(grep -E "Executed [0-9]+ tests?," test-output.log | tail -1 || true)"
          if [ -z "${summary_line}" ]; then
            echo "Could not find an 'Executed N tests' summary line in xcodebuild output; treating as a failure." >&2
            exit 1
          fi
          count="$(echo "${summary_line}" | grep -oE "Executed [0-9]+" | grep -oE "[0-9]+")"
          echo "xcodebuild reported: ${summary_line}"
          if [ "${count}" -lt 1 ]; then
            echo "xcodebuild test executed zero tests." >&2
            exit 1
          fi

  # Produces the downloadable artifact: a Universal 2 (arm64 + x86_64) Meth.app, zipped,
  # with its own internal validation (see scripts/build_app.sh). Release never rebuilds
  # anything.
  #
  # Packaging is split by trust. `package` handles every untrusted run (pull requests,
  # including forks) with an ad-hoc signed build and no environment or secrets.
  # `package-signed` runs only for pushes to main or manual dispatches on main, and is the
  # only job attached to the `release-signing` environment (itself restricted to main).
  # The two conditions are exact complements, so exactly one of them runs.
  package:
    name: Package (ad-hoc signed)
    needs: verify
    if: "!((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')"
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and package Meth.app
        run: ./scripts/build_app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Meth-dist
          path: dist/Meth.zip
          retention-days: 14

  package-signed:
    name: Package (Developer ID signed)
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    environment: release-signing
    runs-on: macos-15
    # Longer than the other jobs: Apple's notary service usually answers in minutes but can
    # take considerably longer.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Import Developer ID certificate into temporary keychain
        id: signing
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_KEYCHAIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Required secret ${name} is not set." >&2
              exit 1
            fi
          done

          signing_dir="${RUNNER_TEMP}/meth-signing"
          keychain_path="${signing_dir}/signing.keychain-db"
          cert_path="${signing_dir}/certificate.p12"
          umask 077
          mkdir -p "${signing_dir}"

          printf '%s' "${APPLE_CERTIFICATE_P12}" | tr -d '[:space:]' | base64 --decode > "${cert_path}"

          security create-keychain -p "${APPLE_KEYCHAIN_PASSWORD}" "${keychain_path}"
          # Auto-lock after 6 hours and on sleep; comfortably longer than the job timeout.
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${APPLE_KEYCHAIN_PASSWORD}" "${keychain_path}"
          # -T limits private key access to codesign rather than granting it to all apps.
          security import "${cert_path}" -k "${keychain_path}" -f pkcs12 \
            -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "${APPLE_KEYCHAIN_PASSWORD}" "${keychain_path}" >/dev/null
          rm -f "${cert_path}"

          # Add to the user search list so codesign can resolve the certificate chain.
          existing_keychains=()
          while IFS= read -r keychain; do
            keychain="${keychain#"${keychain%%[![:space:]]*}"}"
            keychain="${keychain//\"/}"
            [ -n "${keychain}" ] && existing_keychains+=("${keychain}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychain_path}" "${existing_keychains[@]}"

          echo "keychain=${keychain_path}" >> "${GITHUB_OUTPUT}"

      - name: Build and package Meth.app
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SIGNING_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_IDENTITY}" ]; then
            echo "Required secret APPLE_SIGNING_IDENTITY is not set." >&2
            exit 1
          fi
          ./scripts/build_app.sh

      # build_app.sh leaves a zip of the signed-but-unstapled app in dist/. Move it out to
      # serve as the notarization submission, so dist/Meth.zip only exists again once it has
      # been re-created from the stapled app below.
      - name: Notarize Meth.app
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID APPLE_NOTARY_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "Required secret ${name} is not set." >&2
              exit 1
            fi
          done

          notary_dir="${RUNNER_TEMP}/meth-notary"
          umask 077
          mkdir -p "${notary_dir}"
          key_path="${notary_dir}/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          trap 'rm -f "${key_path}"' EXIT
          printf '%s\n' "${APPLE_NOTARY_PRIVATE_KEY}" > "${key_path}"
          notary_auth=(--key "${key_path}" --key-id "${APPLE_NOTARY_KEY_ID}" --issuer "${APPLE_NOTARY_ISSUER_ID}")

          submission_zip="${notary_dir}/Meth-submission.zip"
          mv dist/Meth.zip "${submission_zip}"

          echo "==> Submitting to Apple notary service and waiting for a result..."
          submit_exit=0
          xcrun notarytool submit "${submission_zip}" "${notary_auth[@]}" \
            --wait --timeout 45m --output-format json > "${notary_dir}/submit.json" || submit_exit=$?

          submission_id="$(plutil -extract id raw -o - "${notary_dir}/submit.json" 2>/dev/null || true)"
          status="$(plutil -extract status raw -o - "${notary_dir}/submit.json" 2>/dev/null || true)"
          echo "notarytool exit code: ${submit_exit}"
          echo "Submission ID: ${submission_id:-<none>}"
          echo "Status: ${status:-<unknown>}"

          if [ -n "${submission_id}" ]; then
            echo "==> Notarization log:"
            if xcrun notarytool log "${submission_id}" "${notary_auth[@]}" "${notary_dir}/notary-log.json"; then
              cat "${notary_dir}/notary-log.json"
            else
              echo "Could not retrieve the notarization log." >&2
            fi
          else
            echo "notarytool response:" >&2
            cat "${notary_dir}/submit.json" >&2 || true
          fi

          if [ "${submit_exit}" -ne 0 ] || [ "${status}" != "Accepted" ]; then
            echo "Notarization did not succeed (status: ${status:-<unknown>}); not publishing." >&2
            exit 1
          fi

      - name: Staple and verify notarized Meth.app
        run: |
          set -euo pipefail
          xcrun stapler staple dist/Meth.app
          xcrun stapler validate dist/Meth.app
          codesign --verify --deep --strict --verbose=2 dist/Meth.app
          spctl --assess --type execute --verbose=4 dist/Meth.app

      - name: Create and verify final Meth.zip from stapled app
        run: |
          set -euo pipefail
          ./scripts/package_zip.sh

          # Check what users will actually download: the extracted app must carry the
          # stapled ticket and pass Gatekeeper.
          check_dir="${RUNNER_TEMP}/meth-notary/final-zip-check"
          rm -rf "${check_dir}"
          mkdir -p "${check_dir}"
          ditto -x -k dist/Meth.zip "${check_dir}"
          xcrun stapler validate "${check_dir}/Meth.app"
          codesign --verify --deep --strict --verbose=2 "${check_dir}/Meth.app"
          spctl --assess --type execute --verbose=4 "${check_dir}/Meth.app"
          rm -rf "${check_dir}"

      - name: Remove temporary signing and notarization material
        if: always()
        run: |
          signing_dir="${RUNNER_TEMP}/meth-signing"
          keychain_path="${signing_dir}/signing.keychain-db"
          if [ -f "${keychain_path}" ]; then
            security delete-keychain "${keychain_path}" || true
          fi
          rm -rf "${signing_dir}" "${RUNNER_TEMP}/meth-notary"

      - uses: actions/upload-artifact@v4
        with:
          name: Meth-dist-signed
          path: dist/Meth.zip
          if-no-files-found: error
          retention-days: 14

  # Publishes/updates the single persistent "rolling" release from the exact commit that
  # was just verified and packaged. Only runs for pushes to main or a manual dispatch on
  # main; never for pull requests. Consumes only the signed, notarized and stapled artifact
  # from `package-signed`, since the release notes state the build is signed and notarized.
  # Needs no macOS-specific tooling.
  release:
    name: Update Rolling Release
    needs: package-signed
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: meth-rolling-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: Meth-dist-signed
          path: dist

      - name: Validate the packaged artifact
        run: |
          set -euo pipefail
          test -s dist/Meth.zip
          unzip -tq dist/Meth.zip

      - name: Refuse to move the rolling release backwards
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          target_sha="${GITHUB_SHA}"

          if git rev-parse -q --verify refs/tags/rolling >/dev/null 2>&1; then
            current_sha="$(git rev-parse refs/tags/rolling)"
            if [ "${current_sha}" = "${target_sha}" ]; then
              echo "rolling already points at ${target_sha}; re-publishing in place."
            elif git merge-base --is-ancestor "${current_sha}" "${target_sha}"; then
              echo "Advancing rolling from ${current_sha} to ${target_sha}."
            else
              echo "Refusing to update rolling: current target ${current_sha} is not an ancestor of ${target_sha}." >&2
              exit 1
            fi
          else
            echo "No existing rolling tag; this will be the first release."
          fi

      - name: Prepare release notes
        run: |
          {
            echo "# Latest Meth"
            echo
            echo "This is the latest rolling development build of **Meth**, built directly from \`main\`."
            echo
            echo "- **Commit:** [\`${GITHUB_SHA::7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA})"
            echo "- **Workflow run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- **Build date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "### Download"
            echo
            echo "- \`Meth.zip\` — Universal (Apple Silicon + Intel) macOS application bundle"
            echo
            echo "> [!NOTE]"
            echo "> This is a continuously updated development build. It is signed with an Apple Developer ID Application certificate and notarized by Apple."
          } > release_notes.md

      - name: Publish or update the rolling release
        run: |
          set -euo pipefail
          target_sha="${GITHUB_SHA}"

          if gh release view rolling --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "rolling release already exists; updating it in place."
          else
            echo "Creating rolling release for the first time (as a draft until the asset is uploaded)."
            gh release create rolling \
              --repo "${{ github.repository }}" \
              --draft \
              --target "${target_sha}" \
              --title "Latest Meth" \
              --notes-file release_notes.md
          fi

          # Replace the asset in place; the release stays available throughout.
          gh release upload rolling dist/Meth.zip --repo "${{ github.repository }}" --clobber

          # Move the tag only after the new asset is confirmed uploaded above.
          git tag -f rolling "${target_sha}"
          git push origin refs/tags/rolling --force

          gh release edit rolling \
            --repo "${{ github.repository }}" \
            --draft=false \
            --prerelease=false \
            --latest \
            --title "Latest Meth" \
            --notes-file release_notes.md

      - name: Verify final release state
        run: |
          set -euo pipefail
          target_sha="${GITHUB_SHA}"
          actual_tag_sha="$(git rev-parse refs/tags/rolling)"
          if [ "${actual_tag_sha}" != "${target_sha}" ]; then
            echo "rolling tag points at ${actual_tag_sha}, expected ${target_sha}." >&2
            exit 1
          fi

          view_json="$(gh release view rolling --repo "${{ github.repository }}" --json tagName,isDraft,isPrerelease,assets)"
          tag_name="$(echo "${view_json}" | jq -r '.tagName')"
          is_draft="$(echo "${view_json}" | jq -r '.isDraft')"
          is_prerelease="$(echo "${view_json}" | jq -r '.isPrerelease')"
          has_asset="$(echo "${view_json}" | jq -r '([.assets[].name] | index("Meth.zip")) != null')"

          if [ "${tag_name}" != "rolling" ] || [ "${is_draft}" != "false" ] || [ "${is_prerelease}" != "false" ] || [ "${has_asset}" != "true" ]; then
            echo "Release verification failed: tag=${tag_name} draft=${is_draft} prerelease=${is_prerelease} has_Meth.zip=${has_asset}" >&2
            exit 1
          fi
          echo "Verified: tag=rolling, draft=false, prerelease=false, Meth.zip present, commit=${target_sha}"
